[package]
name = "method_registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
description = "Registry of private AI methods and their versions (code, manifest and runner hashes)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"


[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
