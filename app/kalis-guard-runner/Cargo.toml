[package]
name = "kalis-guard-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
ed25519-dalek = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.36"
wstd = "0.6.5"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
