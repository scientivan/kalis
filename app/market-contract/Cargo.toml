[package]
name = "kalis_market"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
description = "Kalis method registry, per-run escrow and payout split"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
