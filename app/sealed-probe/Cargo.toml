[package]
name = "sealed_probe"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
