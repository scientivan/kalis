[package]
name = "kalis_pool"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
description = "Kalis escrowed crowdfunded bounty pools with automatic refund"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
